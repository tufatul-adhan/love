<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060208">
  <meta name="description" content="An animated heart made from I love you in 20 languages.">
  <title>Love Heart — Multilingual typographic art</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #060208; color: #f8e9ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; overflow-x: hidden; }
    main { width: min(100%, 820px); text-align: center; }
    .eyebrow { margin: 0 0 8px; color: #e99aaa; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(2.3rem, 8vw, 4rem); font-weight: 500; letter-spacing: -.045em; }
    .intro { margin: 10px auto 22px; max-width: 35rem; color: #b9a9b1; line-height: 1.6; }
    .art { position: relative; width: min(100%, 760px); margin: 0 auto; aspect-ratio: 1; }
    canvas { display: block; width: 100%; height: 100%; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; }
    button { border: 1px solid #74404f; border-radius: 999px; background: #1b0c13; color: #ffe8ee; padding: 10px 20px; font: inherit; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #35111e; transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid #ff9fb2; outline-offset: 3px; }
    .hint { color: #8e7e87; font-size: .85rem; }
    footer { margin-top: 22px; color: #776a72; font-size: .8rem; }
    footer a { color: #d890a0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little love, in every language</p>
    <h1>Love, in 20 languages</h1>
    <p class="intro">A heart drawn from “I love you” in twenty languages. Watch each phrase float into place, then press replay to see it bloom again.</p>
    <div class="art"><canvas id="art" aria-label="An animated heart formed from love phrases in twenty languages"></canvas></div>
    <div class="controls"><button id="replay" type="button">Replay animation</button><span class="hint">Made with love ♥</span></div>
    <footer>Also available as a Python desktop animation in the <a href="https://github.com/tufatul-adhan/love">GitHub repository</a>.</footer>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#art');
      const ctx = canvas.getContext('2d');
      const button = document.querySelector('#replay');
      const phrases = [
        'I love you', 'Seni seviyorum', 'Te amo', "Je t'aime", 'Ich liebe dich', 'Ti amo', 'Eu te amo',
        'Я тебя люблю', '사랑해', '愛してる', '我爱你', 'मैं तुमसे प्यार करता हूँ', 'Σ\' αγαπώ',
        'Ik hou van jou', 'Jag älskar dig', 'Kocham cię', 'ฉันรักเธอ', 'Anh yêu em', 'Aku cinta kamu', 'Я тебе кохаю'
      ];
      const bg = '#060208';
      const sizes = [9, 10, 11, 12];
      const scale = 21;
      const lift = 34;
      const gap = 7;
      const duration = 10000;
      let rng, entries, start, frame;

      function random() { // Reproducible variation, like the desktop version.
        let t = rng += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
      function heart(a) {
        return [16 * Math.sin(a) ** 3 * scale,
          (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale + 20];
      }
      function color(hex) {
        return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
      }
      function hex(rgb) {
        return '#' + rgb.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
      }
      function mix(a, b, k) { return a.map((v, i) => v + (b[i] - v) * k); }
      function dim(a, k) { return a.map(v => v * k); }
      function measure(text, size) {
        ctx.font = `700 ${size}px Arial, sans-serif`;
        return ctx.measureText(text).width;
      }
      function build() {
        rng = 11;
        const poly = Array.from({ length: 720 }, (_, i) => heart(2 * Math.PI * i / 720));
        const edges = poly.map((p, i) => [p, poly[(i + 1) % poly.length]]);
        const ys = poly.map(p => p[1]);
        const yMax = Math.max(...ys), yMin = Math.min(...ys), cy = (yMax + yMin) / 2;
        const fontSize = Math.max(...sizes);
        const rowH = fontSize * 1.2 + 4;
        function spans(y) {
          const xs = [];
          for (const [[x1, y1], [x2, y2]] of edges) {
            if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
          }
          xs.sort((a, b) => a - b);
          const pairs = [];
          for (let i = 0; i < xs.length; i += 2) if (xs[i + 1] !== undefined) pairs.push([xs[i], xs[i + 1]]);
          return pairs;
        }
        const order = [...phrases];
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
        let phraseIndex = 0;
        const placed = [];
        for (let y = yMax - rowH / 2; y > yMin + rowH / 2; y -= rowH) {
          const top = spans(y + rowH / 2), bottom = spans(y - rowH / 2);
          for (const [a0, a1] of top) for (const [b0, b1] of bottom) {
            let lo = Math.max(a0, b0) + 4, hi = Math.min(a1, b1) - 4;
            if (hi - lo <= 14) continue;
            let cur = lo + random() * 8;
            const line = [];
            while (true) {
              let fit = null;
              for (let attempt = 0; attempt < 10; attempt++) {
                const text = order[phraseIndex++ % order.length];
                const size = sizes[Math.floor(random() * sizes.length)];
                const width = measure(text, size);
                if (cur + width <= hi) { fit = { text, size, width }; break; }
              }
              if (!fit) break;
              line.push({ x: cur + fit.width / 2, y, ...fit });
              cur += fit.width + gap;
            }
            if (!line.length) continue;
            if (line.length > 1) {
              const slack = hi - (line[line.length - 1].x + line[line.length - 1].width / 2);
              line.forEach((p, i) => p.x += slack * i / (line.length - 1));
            } else line[0].x = (lo + hi) / 2;
            line.forEach((p, i) => { p.edge = i === 0 || i === line.length - 1; placed.push(p); });
          }
        }
        const wine = [.58, 0, .09], crimson = [.90, .05, .14], blood = [.98, .10, .16];
        for (const p of placed) {
          p.rad = Math.min(1, Math.hypot(p.x / (16 * scale), (p.y - cy) / (14.5 * scale)));
          p.color = mix(mix(wine, crimson, .25 + .75 * p.rad), blood, random() * .35 + (p.edge ? .3 : 0)).map(v => Math.min(1, v));
          p.dx = (random() * 20) - 10;
          p.delay = placed.indexOf(p) / Math.max(1, placed.length) * duration * .82;
        }
        return { items: placed, cy };
      }
      function resize() {
        const box = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(box.width * dpr);
        canvas.height = Math.round(box.height * dpr);
        ctx.setTransform(canvas.width / 800, 0, 0, canvas.height / 800, canvas.width / 2, canvas.height / 2);
        ctx.textBaseline = 'middle';
      }
      function draw(now) {
        ctx.clearRect(-400, -400, 800, 800);
        const elapsed = now - start;
        const flash = [1, .78, .78];
        for (const p of entries) {
          const u = Math.max(0, Math.min(1, (elapsed - p.delay) / 700));
          if (u <= 0) continue;
          const e = 1 - (1 - u) ** 3;
          const x = p.x + p.dx * (1 - e);
          const y = -p.y - (1 - e) * lift;
          const base = color(bg);
          ctx.textAlign = 'center';
          ctx.font = `700 ${p.size}px Arial, sans-serif`;
          ctx.fillStyle = hex(mix(base, dim(p.color, .3), e));
          ctx.fillText(p.text, x + 2, y + 3);
          ctx.font = `700 ${p.size + 1}px Arial, sans-serif`;
          ctx.fillStyle = hex(mix(base, dim(p.color, .2), e * e));
          ctx.fillText(p.text, x, y);
          ctx.font = `700 ${p.size}px Arial, sans-serif`;
          const pulse = .75 * Math.sin(Math.PI * Math.max(0, Math.min(1, (u - .55) / .45)));
          ctx.fillStyle = hex(mix(mix(base, p.color, e ** 1.5), flash, pulse));
          ctx.fillText(p.text, x, y);
        }
        if (elapsed > duration + 900) {
          const cycle = (elapsed - duration - 900) % 1400;
          const p = entries[Math.floor((elapsed - duration - 900) / 1400) % entries.length];
          const amount = cycle < 260 ? .6 : 0;
          if (amount) {
            ctx.font = `700 ${p.size}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillStyle = hex(mix(p.color, flash, amount));
            ctx.fillText(p.text, p.x, -p.y);
          }
        }
        frame = requestAnimationFrame(draw);
      }
      function replay() {
        cancelAnimationFrame(frame);
        resize();
        entries = build().items;
        start = performance.now();
        frame = requestAnimationFrame(draw);
      }
      window.addEventListener('resize', resize);
      button.addEventListener('click', replay);
      replay();
    })();
  </script>
</body>
</html>
